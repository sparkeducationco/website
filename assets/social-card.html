<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Spark Filter share artwork</title>
    <link rel="stylesheet" href="/site.css" />
    <style>
      body { width: 1200px; height: 630px; overflow: hidden; }
      .share-card { display: grid; grid-template-columns: 51% 49%; width: 1200px; height: 630px; background: var(--yellow); }
      .share-copy { display: flex; flex-direction: column; padding: 40px 48px 32px; }
      .share-brand { display: flex; align-items: center; gap: 12px; font-size: 28px; font-weight: 700; letter-spacing: -1px; line-height: 40px; }
      .share-brand img { width: 40px; height: 40px; }
      .share-kicker { margin-top: 26px; font-size: 12px; font-weight: 600; letter-spacing: 1.3px; text-transform: uppercase; }
      .share-copy h1 { margin-top: 20px; font-size: 110px; line-height: .95; letter-spacing: -.035em; }
      .share-copy h1 span { display: block; }
      .share-copy h1 em { font-style: italic; }
      .share-description { margin-top: 22px; font-size: 16px; line-height: 1.5; }
      .share-address { margin-top: auto; padding-top: 12px; border-top: 1px solid #a5952d; font-size: 11px; font-weight: 600; letter-spacing: 1.3px; }
      .share-art { position: relative; overflow: hidden; border-left: 1px solid var(--ink); }
      .share-art img { width: 100%; height: 100%; object-fit: cover; object-position: 67% center; }
    </style>
  </head>
  <body>
    <main class="share-card" aria-label="Spark Filter share image">
      <div class="share-copy">
        <div class="share-brand"><img src="/icon.png" alt="" /><span>Spark Filter</span></div>
        <p class="share-kicker">A brighter internet for K–12</p>
        <h1><span>Let</span><span><em>curiosity</em></span><span>lead.</span></h1>
        <p class="share-description">A wider world. A safer way in.</p>
        <p class="share-address">SPARKFORSCHOOLS.COM</p>
      </div>
      <div class="share-art"><img src="/assets/spark-field.webp" alt="An engraved landscape with a bright path of light." /></div>
    </main>
  </body>
</html>
